function renderGantt(){
  var h='<div class="gantt-wrap"><table class="gt"><thead><tr><th class="wh">Zeitraum</th><th class="lh">Maßnahme</th>'+MO.map(function(m){return '<th>'+m+'</th>';}).join('')+'</tr></thead><tbody>';
  gantt.forEach(function(it){
    if(it.ip){h+='<tr class="ph-sep"><td colspan="'+(NM+2)+'" style="color:'+it.c+'">'+it.l+'</td></tr>';return;}
    var L=(it.s/NM*100).toFixed(2),W=Math.max(it.n/NM*100,1.2).toFixed(2);
    var pL=(8.5/NM*100).toFixed(2),pW=(3/NM*100).toFixed(2);
    h+='<tr><td class="wc">'+(it.w||'')+'</td><td class="lc">'+it.l+'</td><td colspan="'+NM+'" style="padding:0"><div class="bwrap" style="min-width:'+(NM*CW)+'px"><div class="btoday"></div><div class="bpause" style="left:'+pL+'%;width:'+pW+'%"></div><div class="gbar" style="left:'+L+'%;width:'+W+'%;background:'+it.c+'">'+it.l+'</div></div></td></tr>';
  });
  h+='</tbody></table></div>';
  h+='<div class="leg">'+Object.entries(GC).map(function(e){return '<span class="li"><span class="ld" style="background:'+e[0]+'"></span>'+e[1]+'</span>';}).join('');
  h+='<span class="li"><span class="ld" style="background:rgba(83,74,183,.15);border:1px solid #534AB7"></span>Mallorca-Pause</span></div>';
  return h;
}

    {icon:'📄',title:'Genehmigungen & Anträge',desc:'Behördliche Dokumente und Förderanträge',examples:['KfW-Zusageschreiben (10.500 €)','BAFA-Antrag Fenster + Kellerdecke','Denkmalamt-Genehmigung energetisch','Denkmalantrag Küche (laufend)']},
    {icon:'🏗️',title:'Projektdokumentation',desc:'Prüfberichte, Pläne, Sachverständigenberichte',examples:['Prüfbericht Sachverständiger (21.03.2024)','Individueller Sanierungsfahrplan (iSFP)','Heizlastberechnung','Grundrisspläne']},
    {icon:'📸',title:'Baudokumentation',desc:'Fotos des Baufortschritts',examples:['Vorher-Aufnahmen','Fortschrittsfotos Treppenhaus','Fortschrittsfotos Zimmer']},
  ];
  h+='<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">';
  cats.forEach(function(cat){
    h+='<div style="background:#fff;border:.5px solid #d3d1c7;border-radius:10px;padding:.875rem 1rem">';
    h+='<div style="display:flex;align-items:center;gap:8px;margin-bottom:.5rem">';
    h+='<span style="font-size:18px">'+cat.icon+'</span>';
    h+='<div style="font-size:13px;font-weight:500;color:#1a1a18">'+cat.title+'</div>';
    h+='</div>';
    h+='<div style="font-size:11px;color:#73726c;margin-bottom:.5rem">'+cat.desc+'</div>';
    h+='<div style="border-top:.5px solid #ebe9e3;padding-top:.5rem">';
    cat.examples.forEach(function(ex){
      h+='<div style="font-size:10px;color:#a09e98;padding:2px 0">· '+ex+'</div>';
    });
    h+='</div></div>';
  });
  h+='</div>';
  h+='<div style="margin-top:1rem;background:#ebe9e3;border-radius:8px;padding:.65rem 1rem;font-size:11px;color:#73726c">';
  h+='<strong style="color:#1a1a18">Tipp:</strong> Neue Rechnungen und Angebote direkt in den Drive-Ordner hochladen – so hat dein Vater immer den aktuellen Stand.';
  h+='</div>';
  return h;
}

function render(){
  var TABS=[['overview','Übersicht'],['zt','Zeitplan'],['at','Alle Aufgaben'],['vb','Vorbereiten'],['fl','Fremdleistungen'],['dok','Dokumente']];
  document.getElementById('tabs').innerHTML=TABS.map(function(t){return '<button class="tab'+(tab===t[0]?' on':'')+'" onclick="setTab(\''+t[0]+'\')">'+t[1]+'</button>';}).join('');
  var el=document.getElementById('content');
  if(tab==='overview')el.innerHTML=renderOverview();
  else if(tab==='zt')el.innerHTML=renderGantt();
  else if(tab==='at')el.innerHTML=renderTasks();
  else if(tab==='vb')el.innerHTML=renderVorbereiten();
  else if(tab==='dok')el.innerHTML=renderDokumente();
  else el.innerHTML=renderFremd();
}
render();
</script>
